name: Deploy RJ Properties to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.svg' -o -name '*.webmanifest' \) -exec cp {} _site/ \;
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed website, catalog and property photo
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SUPABASE_URL: https://bgmlgmdhypmfabyluqvv.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_oy6A_pRkScEU94X33EzJFA_es-_b1Dg
        run: |
          node <<'NODE'
          const base = process.env.PAGE_URL;
          const must = (ok, message) => { if (!ok) throw new Error(message); console.log('PASS:', message); };
          async function get(path) {
            const url = new URL(path, base).toString();
            let response;
            for (let attempt = 0; attempt < 8; attempt++) {
              try {
                response = await fetch(url, { redirect: 'follow' });
                if (response.ok) return { response, body: await response.text(), url };
              } catch (_) {}
              await new Promise(resolve => setTimeout(resolve, 4000));
            }
            throw new Error('Live URL not reachable: ' + url + ' status=' + (response?.status ?? 'network error'));
          }
          const home = await get('');
          must(home.body.includes('id="buyerForm"') && home.body.includes('id="sellerForm"') && home.body.includes('id="propertySearch"'), 'Homepage and buyer/seller/search forms are deployed');
          const listing = await get('properties.html');
          must(listing.body.includes('app.js'), 'Properties page is deployed');
          const sell = await get('sell.html');
          must(sell.body.includes('id="propertyForm"') && sell.body.includes('app.js'), 'Full seller intake form is deployed');
          const detail = await get('property.html');
          must(detail.body.includes('renderPropertyDetail') && detail.body.includes('app.js'), 'Property detail and site-visit handler are deployed');
          const admin = await get('admin.html');
          must(admin.body.includes('id="propertyAdminForm"') && admin.body.includes('uploadPropertyPhotos'), 'Secure property manager with add/edit and photo upload is deployed');
          must(admin.body.includes('id="headerEditProperties"') && admin.body.includes("openTab('properties')"), 'Direct Edit Properties navigation is deployed');
          must(admin.body.includes('function editProperty(id)') && admin.body.includes('loadPropertiesAdmin'), 'Property list and edit handler are deployed');
          must(admin.body.includes("field==='p-price'&&Number(value)>1000)value=Number(value)/10000000"), 'CRM editor converts rupee-denominated legacy prices into crore units before editing');
          must(admin.body.includes('function formatPropertyPrice(value)') && admin.body.includes("esc(formatPropertyPrice(r.price))"), 'CRM property cards display prices in crore units instead of raw rupees');
          must(admin.body.includes("Math.round(Number($('p-price').value)*10000000)"), 'CRM saves crore-entered prices back to rupee-denominated database values');
          must(admin.body.includes('Make main') && admin.body.includes('Remove'), 'Property manager supports choosing the main photo and removing photos from a listing');
          const inlineScripts = [...admin.body.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(x => x.trim());
          for (const script of inlineScripts) new Function(script);
          must(inlineScripts.length > 0, 'Property manager inline JavaScript passes syntax validation');
          const app = await get('app.js');
          must(app.body.includes('create_public_enquiry') && app.body.includes('create_seller_intake') && app.body.includes('create_site_visit_request'), 'Frontend RPC wiring is present');
          const catalogResponse = await fetch(process.env.SUPABASE_URL + '/rest/v1/rpc/get_published_properties', {
            method: 'POST',
            headers: { apikey: process.env.SUPABASE_PUBLISHABLE_KEY, Authorization: 'Bearer ' + process.env.SUPABASE_PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
            body: '{}'
          });
          must(catalogResponse.ok, 'Public Supabase property catalog responds HTTP ' + catalogResponse.status);
          const catalog = await catalogResponse.json();
          must(Array.isArray(catalog), 'Public property catalog returns an array');
          // Read-only anonymous checks: private CRM tables must not disclose rows to a public visitor.
          for (const table of ['buyers', 'owners', 'property_owner_private', 'call_logs', 'followups', 'site_visits', 'enquiries']) {
            const response = await fetch(process.env.SUPABASE_URL + '/rest/v1/' + table + '?select=*&limit=1', {
              headers: { apikey: process.env.SUPABASE_PUBLISHABLE_KEY, Authorization: 'Bearer ' + process.env.SUPABASE_PUBLISHABLE_KEY }
            });
            if (response.status === 401 || response.status === 403) {
              must(true, 'Anonymous read blocked for private CRM table ' + table + ' (HTTP ' + response.status + ')');
              continue;
            }
            must(response.ok, 'Anonymous read safely handled for private CRM table ' + table + ' (HTTP ' + response.status + ')');
            const privateRows = await response.json();
            must(Array.isArray(privateRows) && privateRows.length === 0, 'Anonymous visitor cannot read rows from private CRM table ' + table);
          }
          const avni = catalog.find(p => String(p.title || '').toLowerCase().includes('avni lake view villas'));
          must(!!avni, 'Avni Lake View Villas appears in the published catalog');
          const photoUrl = avni.primary_media_url || avni.media?.[0]?.url;
          must(typeof photoUrl === 'string' && photoUrl.startsWith('https://raw.githubusercontent.com/'), 'Published Avni listing has a hosted photo URL');
          const photo = await fetch(photoUrl);
          const photoType = (photo.headers.get('content-type') || '').toLowerCase();
          const photoBytes = await photo.arrayBuffer();
          must(photo.ok && (photoType.includes('image/webp') || photoType.includes('image/')), 'Hosted Avni photo returns an image response (' + photo.status + ', ' + photoType + ')');
          must(photoBytes.byteLength > 5000, 'Hosted Avni photo payload is non-empty (' + photoBytes.byteLength + ' bytes)');
          console.log('LIVE_SMOKE_TEST_OK', JSON.stringify({ page: base, publishedProperties: catalog.length, avniPhotoBytes: photoBytes.byteLength }));
          NODE
      - name: Install browser for non-mutating UI checks
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify buyer and seller forms without creating production records
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'NODE'
          (async () => {
            const { chromium } = require('playwright');
            const base = process.env.PAGE_URL;
            const must = (ok, message) => { if (!ok) throw new Error(message); console.log('PASS:', message); };
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            try {
              await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
              await page.locator('#buyerForm').waitFor();
              await page.locator('#sellerForm').waitFor();
              await page.locator('#propertySearch').waitFor();
              must(await page.locator('#buyerForm button[type="submit"]').count() === 1, 'Buyer enquiry form renders');
              must(await page.locator('#sellerForm button[type="submit"]').count() === 1, 'Seller enquiry form renders');
              await page.goto(new URL('sell.html', base).toString(), { waitUntil: 'networkidle', timeout: 60000 });
              await page.locator('#propertyForm').waitFor();
              must(await page.locator('#propertyForm button[type="submit"]').count() === 1, 'Full property intake form renders');
              await page.goto(new URL('properties.html', base).toString(), { waitUntil: 'networkidle', timeout: 60000 });
              must(await page.locator('body').innerText().then(t => t.length > 0), 'Properties page renders');
              await page.locator('#allGrid .property-card').first().waitFor({ timeout: 20000 });
              const listingKeys = await page.locator('#allGrid .property-card').evaluateAll(cards => cards.map(card => ['.badge','.price','.meta','.card-mini'].map(sel => card.querySelector(sel)?.textContent?.trim().toLowerCase().replace(/\\s+/g,' ') || '').join('|')));
              must(new Set(listingKeys).size === listingKeys.length, 'Public catalog does not show the same property twice under different titles');
              const avniCard = page.locator('#allGrid .property-card').filter({ hasText: 'Avni Lake View Villas' });
              must(await avniCard.count() === 1, 'Avni Lake View Villas appears exactly once in the public catalog');
              must((await avniCard.innerText()).includes('₹ 5.40 Cr'), 'Avni listing price is formatted as ₹ 5.40 Cr');
              const detailHref = await avniCard.locator('a').getAttribute('href');
              must(!!detailHref, 'Avni listing opens a property detail page');
              await page.goto(new URL(detailHref, base).toString(), { waitUntil: 'networkidle', timeout: 60000 });
              await page.locator('.detail-card').waitFor({ timeout: 20000 });
              const galleryUrls = await page.locator('.media-strip img').evaluateAll(imgs => imgs.map(img => img.getAttribute('src')).filter(Boolean));
              must(new Set(galleryUrls).size === galleryUrls.length, 'Property detail gallery does not repeat the same photo URL');
              await page.locator('.site-visit-open').click();
              await page.locator('#siteVisitForm').waitFor();
              must(await page.locator('#siteVisitForm input[name="name"]').count() === 1 && await page.locator('#siteVisitForm input[name="phone"]').count() === 1 && await page.locator('#siteVisitForm input[name="visitDate"]').count() === 1, 'Site-visit request form renders required contact and date fields');
              must(await page.locator('#siteVisitForm button[type="submit"]').count() === 1, 'Site-visit request submit button renders without creating a production lead');
              const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              try {
                await desktop.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
                await desktop.locator('#buyerForm').waitFor();
                await desktop.locator('#sellerForm').waitFor();
                const layout = await desktop.evaluate(() => ({ viewport: document.documentElement.clientWidth, page: document.documentElement.scrollWidth }));
                must(layout.page <= layout.viewport + 2, 'Desktop homepage has no horizontal overflow (' + JSON.stringify(layout) + ')');
              } finally {
                await desktop.close();
              }
              console.log('LIVE_UI_SMOKE_OK');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
