name: Deploy RJ Properties to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.svg' -o -name '*.webmanifest' \) -exec cp {} _site/ \;
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed website, catalog and property photo
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SUPABASE_URL: https://bgmlgmdhypmfabyluqvv.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_oy6A_pRkScEU94X33EzJFA_es-_b1Dg
        run: |
          node <<'NODE'
          const base = process.env.PAGE_URL;
          const must = (ok, message) => { if (!ok) throw new Error(message); console.log('PASS:', message); };
          async function get(path) {
            const url = new URL(path, base).toString();
            let response;
            for (let attempt = 0; attempt < 8; attempt++) {
              try {
                response = await fetch(url, { redirect: 'follow' });
                if (response.ok) return { response, body: await response.text(), url };
              } catch (_) {}
              await new Promise(resolve => setTimeout(resolve, 4000));
            }
            throw new Error('Live URL not reachable: ' + url + ' status=' + (response?.status ?? 'network error'));
          }
          const home = await get('');
          must(home.body.includes('id="buyerForm"') && home.body.includes('id="sellerForm"') && home.body.includes('id="propertySearch"'), 'Homepage and buyer/seller/search forms are deployed');
          const listing = await get('properties.html');
          must(listing.body.includes('app.js'), 'Properties page is deployed');
          const sell = await get('sell.html');
          must(sell.body.includes('id="propertyForm"') && sell.body.includes('app.js'), 'Full seller intake form is deployed');
          const detail = await get('property.html');
          must(detail.body.includes('renderPropertyDetail') && detail.body.includes('app.js'), 'Property detail and site-visit handler are deployed');
          const app = await get('app.js');
          must(app.body.includes('create_public_enquiry') && app.body.includes('create_seller_intake') && app.body.includes('create_site_visit_request'), 'Frontend RPC wiring is present');
          const catalogResponse = await fetch(process.env.SUPABASE_URL + '/rest/v1/rpc/get_published_properties', {
            method: 'POST',
            headers: { apikey: process.env.SUPABASE_PUBLISHABLE_KEY, Authorization: 'Bearer ' + process.env.SUPABASE_PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
            body: '{}'
          });
          must(catalogResponse.ok, 'Public Supabase property catalog responds HTTP ' + catalogResponse.status);
          const catalog = await catalogResponse.json();
          must(Array.isArray(catalog), 'Public property catalog returns an array');
          const avni = catalog.find(p => String(p.title || '').toLowerCase().includes('avni lake view villas'));
          must(!!avni, 'Avni Lake View Villas appears in the published catalog');
          const photoUrl = avni.primary_media_url || avni.media?.[0]?.url;
          must(typeof photoUrl === 'string' && photoUrl.startsWith('https://raw.githubusercontent.com/'), 'Published Avni listing has a hosted photo URL');
          const photo = await fetch(photoUrl);
          const photoType = (photo.headers.get('content-type') || '').toLowerCase();
          const photoBytes = await photo.arrayBuffer();
          must(photo.ok && (photoType.includes('image/webp') || photoType.includes('image/')), 'Hosted Avni photo returns an image response (' + photo.status + ', ' + photoType + ')');
          must(photoBytes.byteLength > 5000, 'Hosted Avni photo payload is non-empty (' + photoBytes.byteLength + ' bytes)');
          console.log('LIVE_SMOKE_TEST_OK', JSON.stringify({ page: base, publishedProperties: catalog.length, avniPhotoBytes: photoBytes.byteLength }));
          NODE
      - name: Install browser for real form submissions
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: E2E test buyer, seller and site-visit submissions
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = process.env.PAGE_URL;
          const must = (ok, message) => { if (!ok) throw new Error(message); console.log('PASS:', message); };
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const submitAndCheckDialog = async (formSelector, expectedText) => {
            const dialogPromise = page.waitForEvent('dialog', { timeout: 30000 });
            await page.locator(formSelector + ' button[type="submit"]').click();
            const dialog = await dialogPromise;
            const message = dialog.message();
            await dialog.accept();
            must(message.toLowerCase().includes(expectedText.toLowerCase()), formSelector + ' accepted by backend: ' + message);
          };
          try {
            await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('#buyerForm').waitFor();
            await page.locator('#buyerForm [name="name"]').fill('RJ QA E2E BUYER 20261013');
            await page.locator('#buyerForm [name="phone"]').fill('0000000001');
            await page.locator('#buyerForm [name="email"]').fill('qa-buyer@example.invalid');
            await page.locator('#buyerForm [name="budget"]').fill('3-4 Cr');
            await page.locator('#buyerForm [name="location"]').fill('Ibrahim Bagh');
            await page.locator('#buyerForm [name="propertyType"]').selectOption({ label: 'Villa' });
            await page.locator('#buyerForm [name="bhk"]').selectOption({ label: '4 BHK' });
            await page.locator('#buyerForm [name="purpose"]').selectOption({ label: 'Self-use' });
            await page.locator('#buyerForm [name="requirements"]').fill('Automated E2E test only; remove after verification');
            await submitAndCheckDialog('#buyerForm', 'received');
            await page.locator('#sellerForm [name="name"]').fill('RJ QA E2E HOME SELLER 20261013');
            await page.locator('#sellerForm [name="phone"]').fill('0000000002');
            await page.locator('#sellerForm [name="community"]').fill('QA Only');
            await page.locator('#sellerForm [name="location"]').fill('Ibrahim Bagh');
            await page.locator('#sellerForm [name="propertyType"]').selectOption({ label: 'Villa' });
            await page.locator('#sellerForm [name="bhk"]').fill('4 BHK');
            await page.locator('#sellerForm [name="area"]').fill('200 Sq.Yds');
            await submitAndCheckDialog('#sellerForm', 'received');
            await page.goto(new URL('sell.html', base).toString(), { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('#propertyForm [name="propertyType"]').selectOption({ label: 'Villa' });
            await page.locator('#propertyForm [name="ownerName"]').fill('RJ QA E2E FULL SELLER 20261013');
            await page.locator('#propertyForm [name="ownerContact"]').fill('0000000004');
            await page.locator('#propertyForm [name="locality"]').fill('Ibrahim Bagh');
            await page.locator('#propertyForm [name="area"]').fill('200 Sq.Yds');
            await page.locator('#propertyForm [name="availability"]').fill('QA_TEST');
            await page.locator('#propertyForm [name="propertyNotes"]').fill('Automated E2E test only; remove after verification');
            await page.locator('#propertyForm button[type="submit"]').click();
            await page.waitForFunction(() => (document.querySelector('#propertyMsg')?.textContent || '').includes('received successfully'), null, { timeout: 30000 });
            must(true, 'Full property owner intake accepted by backend');
            const visitUrl = new URL('property.html?id=avni-lake-view-villas-g-2-villa-0f5b1e2a', base).toString();
            await page.goto(visitUrl, { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('.site-visit-open').waitFor({ timeout: 30000 });
            await page.locator('.site-visit-open').click();
            await page.locator('#siteVisitForm [name="name"]').fill('RJ QA E2E SITE VISIT 20261013');
            await page.locator('#siteVisitForm [name="phone"]').fill('0000000003');
            await page.locator('#siteVisitForm [name="visitDate"]').fill('2026-10-20');
            await page.locator('#siteVisitForm [name="visitTime"]').fill('11:30');
            await page.locator('#siteVisitForm [name="notes"]').fill('Automated E2E test only; remove after verification');
            await page.locator('#siteVisitForm button[type="submit"]').click();
            await page.waitForFunction(() => (document.querySelector('#siteVisitMsg')?.textContent || '').includes('request received'), null, { timeout: 30000 });
            must(true, 'Site-visit request accepted by backend');
            console.log('LIVE_FORM_E2E_OK', JSON.stringify({ buyer: true, shortSeller: true, fullSeller: true, siteVisit: true }));
          } finally {
            await browser.close();
          }
          NODE
