name: WhatsApp webhook checks

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/whatsapp-cloud-webhook/**"
      - ".github/workflows/whatsapp-webhook-checks.yml"
  push:
    branches: [integration/whatsapp-coexistence]
    paths:
      - "supabase/functions/whatsapp-cloud-webhook/**"
      - ".github/workflows/whatsapp-webhook-checks.yml"

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Normalize formatting in CI workspace
        run: deno fmt supabase/functions/whatsapp-cloud-webhook/index.ts
      - name: Type check
        run: deno check supabase/functions/whatsapp-cloud-webhook/index.ts\n          deno check supabase/functions/whatsapp-embedded-signup/index.ts
